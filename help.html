<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Get started</title>
	<style type="text/css">
		figure{margin-bottom: 35px; background-color: white; padding-bottom: 8px;}
		img{display: block; margin-left: auto; margin-right: auto;}
		figcaption{display: block; margin-left: auto; margin-right: auto; width: 96%;}
	</style>
</head>
<body style="font-weight: bold; text-align: justify; text-justify: auto; line-height: 1.2; background-color: #e6e6e6;">
	<div style="margin-right: auto; margin-left: auto; max-width: 450px; position: relative; padding-top: 35px;">
		<p style="text-align: center; font-size: 35px; width:96%; max-width: 450px; margin-left: auto; margin-right: auto; margin-bottom: 10px; margin-top: 0px; color: blue"><a href="admin_dashboard.html" style="float: left;text-decoration: none;">&#x2190;</a>Get Started</p>
		<p style="font-size: 25px; font-family: Arial, Sans-Serif; color: green; font-weight: normal; width:96%; max-width: 450px; margin-left: auto; margin-right: auto; margin-top: 0px; margin-bottom: 30px;">This apllication enable your customers to follow the queue from anywhere. They do not need to stay in the service providing place waiting for their turn.</p>
	    <figure style="width:96%; max-width: 450px; margin-left: auto; margin-right: auto; margin-top: 0px;">
	    	<figcaption style="font-size: 25px; color: blue; padding-top: 3px; padding-bottom: 3px; margin-bottom: 8px;">Start by clicking the word <span style="color: green;">here</span></figcaption>
		    <img src="fig1.png" style="width:96%; height: auto;">
		</figure>

		<figure style="width:96%; max-width: 450px; margin-left: auto; margin-right: auto;">
			<figcaption style="font-size: 25px; color: blue; padding-top: 3px; padding-bottom: 3px; margin-bottom: 8px;">Copy customers link</figcaption>
		    <img src="fig2.png" style="width:96%; height: auto;">
		</figure>

		<figure style="width:96%; max-width: 450px; margin-left: auto; margin-right: auto; text-align: center;">
			<figcaption style="font-size: 25px; color: blue; padding-top: 3px; padding-bottom: 3px; margin-bottom: 8px; text-align: justify; text-justify: auto;">Share the link with your customers to enable them to follow the queue</figcaption>
		    <div style="background-color: #e6ffb3; margin-left: auto; margin-right: auto; width: 96%; padding-bottom: 10px; padding-top:10px"><img src="social_media.png" style="width:50%; height: auto;"></div>
		</figure>

		<figure style="width:96%; max-width: 450px; margin-left: auto; margin-right: auto; text-align: center;">
			<figcaption style="font-size: 25px; color: blue; padding-top: 3px; padding-bottom: 3px; margin-bottom: 8px; text-align: justify; text-justify: auto;">This is the user interface which enable your customers to follow the queue</figcaption>
		    <img src="customer_UI.png" style="width:96%; height: auto;">
		</figure>

		<figure style="width:96%; max-width: 450px; margin-left: auto; margin-right: auto;">
			<figcaption style="font-size: 25px; color: blue; padding-top: 3px; padding-bottom: 3px; margin-bottom: 8px;">Download the QR code</figcaption>
		    <img src="fig3.png" style="width:96%; height: auto;">
		</figure>

		<figure style="width:96%; max-width: 450px; margin-left: auto; margin-right: auto; text-align: center;">
			<figcaption style="font-size: 25px; color: blue; padding-top: 3px; padding-bottom: 3px; margin-bottom: 8px; text-align: justify; text-justify: auto;">Print the QR code</figcaption>
		    <div style="background-color: #e6ffb3; margin-left: auto; margin-right: auto; width: 96%; padding-bottom: 10px; padding-top:10px"><img src="print_qr.png" style="width:50%; height: auto;"></div>
		</figure>

		<figure style="width:96%; max-width: 450px; margin-left: auto; margin-right: auto; text-align: center;">
			<figcaption style="font-size: 25px; color: blue; padding-top: 3px; padding-bottom: 3px; margin-bottom: 8px; text-align: justify; text-justify: auto;">Your customers can follow the queue by scanning the QR code</figcaption>
		    <div style="background-color: #e6ffb3; margin-left: auto; margin-right: auto; width: 96%; padding-bottom: 10px; padding-top:10px"><img src="scan.png" style="width:50%; height: auto;"></div>
		</figure>

		<figure style="width:96%; max-width: 450px; margin-left: auto; margin-right: auto;">
			<figcaption style="font-size: 25px; color: blue; padding-top: 3px; padding-bottom: 3px; margin-bottom: 8px;">After calling first customer, enter 1 and then click Send</figcaption>
		    <img src="fig4.png" style="width:96%; height: auto;">
		</figure>

		<figure style="width:96%; max-width: 450px; margin-left: auto; margin-right: auto;">
			<figcaption style="font-size: 25px; color: blue; padding-top: 3px; padding-bottom: 3px; margin-bottom: 8px;">Last called customer in your customers interface is updated to 1</figcaption>
		    <img src="fig5.png" style="width:96%; height: auto;">
		</figure>

		<figure style="width:96%; max-width: 450px; margin-left: auto; margin-right: auto;">
			<figcaption style="font-size: 25px; color: blue; padding-top: 3px; padding-bottom: 3px; margin-bottom: 8px;">After calling second customer, enter 2 and then click Send. And so on for all customers</figcaption>
		    <img src="fig6.png" style="width:96%; height: auto;">
		</figure>

		<figure style="width:96%; max-width: 450px; margin-left: auto; margin-right: auto;">
			<figcaption style="font-size: 25px; color: blue; padding-top: 3px; padding-bottom: 3px; margin-bottom: 8px;">Last called customer in your customers interface is updated to 2</figcaption>
		    <img src="fig7.png" style="width:96%; height: auto;">
		</figure>

		<figure style="width:96%; max-width: 450px; margin-left: auto; margin-right: auto;">
			<figcaption style="font-size: 25px; color: blue; padding-top: 3px; padding-bottom: 3px; margin-bottom: 8px;">After serving last customer, click End</figcaption>
		    <img src="fig8.png" style="width:96%; height: auto;">
		</figure>

		<figure style="width:96%; max-width: 450px; margin-left: auto; margin-right: auto;">
			<figcaption style="font-size: 25px; color: blue; padding-top: 3px; padding-bottom: 3px; margin-bottom: 8px;">Your customers is infomed that you have stopped providing the service</figcaption>
		    <img src="fig9.png" style="width:96%; height: auto;">
		</figure>

		<figure style="width:96%; max-width: 450px; margin-left: auto; margin-right: auto;">
			<figcaption style="font-size: 25px; color: blue; padding-top: 3px; padding-bottom: 3px; margin-bottom: 8px;">your customers can adjust sound alert to play at specific customer number</figcaption>
		    <img src="fig10.png" style="width:96%; height: auto;">
		</figure>
		<a href="help1.html" style="position: absolute; top: 10px; right: 10px; text-decoration: none;">Ar</a>
	</div>	 
</body>
</html>
